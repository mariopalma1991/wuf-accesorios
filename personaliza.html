<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diseña su Wuf! · Wuf! accesorios</title>
<meta name="description" content="Arma el collar de tu perrito: elige medida, dos colores de paracord, plaquita solidaria y envío. Míralo en vivo y manda tu pedido.">
<meta property="og:title" content="Diseña su Wuf! · Wuf! accesorios">
<meta property="og:description" content="Arma el collar de tu perrito: elige medida, dos colores de paracord, plaquita solidaria y envío. Míralo en vivo y manda tu pedido.">
<meta property="og:image" content="assets/img/nala.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FF6B85">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Arimo:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF9F0}
a{color:#28314D}a:hover{color:#28314D}
button{font-family:inherit;cursor:pointer}
.wbtn{transition:transform .15s ease}
.wbtn:hover{transform:translateY(-2px)}
.wopt{transition:transform .12s ease}
.wopt:hover{transform:translateY(-2px)}
.wbtn:focus-visible,.wopt:focus-visible,.wlink:focus-visible,input:focus-visible{outline:3px solid #28314D;outline-offset:3px}
.wlink{text-decoration:none;background-image:linear-gradient(#FFCF46,#FFCF46);background-size:100% 4px;background-repeat:no-repeat;background-position:0 100%}
.wlink:hover{background-size:100% 100%}
.wrange{-webkit-appearance:none;appearance:none;display:block;width:100%;height:16px;border-radius:999px;margin:0;outline:none;cursor:pointer}
.wrange::-webkit-slider-runnable-track{height:16px;border-radius:999px;background:transparent}
.wrange::-moz-range-track{height:16px;border-radius:999px;background:transparent}
.wrange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:36px;height:36px;margin-top:-10px;border-radius:50%;background:#28314D;border:5px solid #FFFFFF;box-shadow:0 2px 10px rgba(40,49,77,.45);cursor:grab}
.wrange::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#28314D;border:5px solid #FFFFFF;box-shadow:0 2px 10px rgba(40,49,77,.45);cursor:grab}
.wrange:active::-webkit-slider-thumb{cursor:grabbing}
.wrange:focus-visible::-webkit-slider-thumb{outline:3px solid #FFCF46;outline-offset:2px}
.wrange:focus-visible::-moz-range-thumb{outline:3px solid #FFCF46;outline-offset:2px}
.wlayer{position:absolute;inset:0;mix-blend-mode:multiply;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;transition:background-color .25s ease}
.wmaskA{-webkit-mask-image:url(assets/img/collar_mask_a.png);mask-image:url(assets/img/collar_mask_a.png)}
.wsw{background-image:url(assets/img/sprite.jpg);background-size:600% 700%;background-repeat:no-repeat;background-color:#EFE4D4}
.wpmA{-webkit-mask-image:url(assets/img/placa_mask_a.png);mask-image:url(assets/img/placa_mask_a.png)}
.wpmB{-webkit-mask-image:url(assets/img/placa_mask_b.png);mask-image:url(assets/img/placa_mask_b.png)}
.wmaskB{-webkit-mask-image:url(assets/img/collar_mask_b.png);mask-image:url(assets/img/collar_mask_b.png)}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: Nunito, system-ui, sans-serif; color: #28314D; background: #FFF9F0; min-height: 100vh; overflow-x: hidden">

<!-- NAV -->
<header style="max-width: 1240px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" aria-label="Wuf! inicio" style="display: flex; align-items: center"><img src="assets/img/logo.png" alt="Wuf!" style="height: 56px; width: auto; display: block"></a>
<nav aria-label="Principal" style="display: flex; flex-wrap: wrap; align-items: center; gap: clamp(12px, 3vw, 32px); font-weight: 700; font-size: 16px">
<a class="wlink" href="index.html" style="padding: 2px">Inicio</a>
<a class="wlink" href="#disena" style="padding: 2px">Diseñar</a>
</nav>
</header>

<!-- HERO -->
<section style="max-width: 1240px; margin: 0 auto; padding: clamp(16px, 4vw, 40px) clamp(16px, 4vw, 40px) clamp(32px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 48px">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase">Diseña su Wuf!</p>
<h1 style="margin: 0; font-family: 'Baloo 2', Nunito, sans-serif; font-weight: 800; font-size: clamp(40px, 5.6vw, 68px); line-height: 1.12; letter-spacing: -.01em">Escoge sus colores y míralo <span style="display: inline-block; background: #FFCF46; padding: 0 .14em .06em; border-radius: 14px; line-height: 1.05; white-space: nowrap">en vivo</span>.</h1>
</div>
<p style="margin: 0; flex: 1 1 320px; max-width: 28em; font-size: 19px; line-height: 30px; color: #4A5270">Elige la medida y dos colores de paracord. Al final te damos el pedido listo para mandarlo por WhatsApp.</p>
</section>

<!-- BUILDER -->
<section id="disena" style="max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px) clamp(64px, 8vw, 104px); display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px">

<!-- PREVIEW COLUMN -->
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="background: #EEE8FB; border-radius: 32px; padding: clamp(16px, 2.4vw, 24px); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 4px 6px 0">
<span style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase">Así se verá <span style="letter-spacing: .08em; color: #5B6380">· aproximado</span></span>
<span style="background: #FFFFFF; border-radius: 999px; padding: 6px 14px; font-size: 14px; line-height: 18px; font-weight: 800">{{sizeLabel}}</span>
</div>
<div role="img" aria-label="{{previewLabel}}" style="position: relative; width: 100%; aspect-ratio: 1185 / 500; border-radius: 22px; overflow: hidden; isolation: isolate; box-shadow: 0 18px 40px -16px rgba(40,49,77,.35); background: #6B3A1E; container-type: inline-size">
<img src="assets/img/collar_base.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
<div class="wlayer wmaskA" style="background: {{patA}}"></div>
<div class="wlayer wmaskB" style="background: {{patB}}"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px 4px">
<span style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 14px; line-height: 18px; font-weight: 700"><span class="wsw" aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(40,49,77,.25); {{swA}}"></span>Principal: {{colorA}}</span>
<span style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 14px; line-height: 18px; font-weight: 700"><span class="wsw" aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(40,49,77,.25); {{swB}}"></span>Contraste: {{colorB}}</span>
</div>
<p style="margin: 0; padding: 0 6px 4px; font-size: 14px; line-height: 20px; color: #4A5270">{{previewNote}}</p>
</div>
<!-- 2 COLORES -->
<fieldset style="margin: 0; border: 2px solid #EFE4D4; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
<legend style="padding: 0 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px"><span style="display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: #FFCF46; align-items: center; justify-content: center; font-size: 17px; margin-right: 8px">1</span>Colores del tejido</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px">
<sc-for list="{{targets}}" as="t" hint-placeholder-count="2">
<button class="wopt" type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 64px; border-radius: 16px; border: 2px solid {{t.border}}; background: {{t.bg}}; color: #28314D; padding: 10px 12px; display: flex; align-items: center; gap: 12px; text-align: left">
<span class="wsw" aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(40,49,77,.2); {{t.sw}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase">{{t.label}}</span>
<span style="font-weight: 800; font-size: 16px; line-height: 20px">{{t.value}}</span>
</span>
</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 700">Ahora eliges: {{targetHint}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px">
<sc-for list="{{colors}}" as="k" hint-placeholder-count="42">
<button class="wopt wsw" type="button" onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" aria-label="{{k.name}}" title="{{k.name}}" style="width: 100%; aspect-ratio: 1 / 1; min-height: 44px; border-radius: 50%; padding: 0; border: 3px solid {{k.ring}}; box-shadow: {{k.shadow}}; {{k.sw}}"></button>
</sc-for>
</div>
</fieldset>

<!-- 3 MASCOTA -->
<fieldset style="margin: 0; border: 2px solid #EFE4D4; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<legend style="padding: 0 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px"><span style="display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: #75D6C0; align-items: center; justify-content: center; font-size: 17px; margin-right: 8px">2</span>Tú y tu mascota</legend>
<label for="cliente" style="font-weight: 700; font-size: 16px">Tu primer nombre</label>
<input id="cliente" type="text" maxlength="30" autocomplete="given-name" value="{{clientName}}" onInput="{{onClientName}}" placeholder="Ej. Laura" style="min-height: 52px; box-sizing: border-box; border: 2px solid #28314D; border-radius: 14px; padding: 10px 16px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 22px; color: #28314D; background: #FFF9F0">
<label for="mascota" style="font-weight: 700; font-size: 16px; margin-top: 6px">¿Cómo se llama tu mascota?</label>
<input id="mascota" type="text" maxlength="30" autocomplete="off" value="{{petName}}" onInput="{{onPetName}}" placeholder="Ej. Nala" style="min-height: 52px; box-sizing: border-box; border: 2px solid #28314D; border-radius: 14px; padding: 10px 16px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 22px; color: #28314D; background: #FFF9F0">
<sc-if value="{{multiStyle}}" hint-placeholder-val="{{ false }}">
<span style="font-weight: 700; font-size: 16px">Estilo de letra</span>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px">
<sc-for list="{{styleOpts}}" as="y" hint-placeholder-count="4">
<button class="wopt" type="button" onClick="{{y.pick}}" aria-pressed="{{y.pressed}}" style="border-radius: 18px; border: 2px solid {{y.border}}; background: {{y.bg}}; color: #28314D; padding: 8px 8px 12px; display: flex; flex-direction: column; align-items: stretch; gap: 8px; text-align: left">
<span style="display: block; aspect-ratio: {{y.ratio}}; border-radius: 12px; overflow: hidden; background: {{y.tile}}; position: relative">
<img src="{{y.photo}}" alt="Letras {{y.name}}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: {{y.imgDisplay}}">
<span style="position: absolute; inset: 0; display: {{y.noPhotoDisplay}}; align-items: center; justify-content: center; padding: 12px; text-align: center; font-family: 'Baloo 2', sans-serif; font-size: 20px; line-height: 24px; font-weight: 800; color: #28314D">{{y.legend}}</span>
</span>
<span style="padding: 0 4px; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; line-height: 22px">{{y.name}}</span><span style="font-size: 13px; line-height: 16px; font-weight: 800; white-space: nowrap">{{y.sub}}</span></span>
<span style="font-size: 14px; line-height: 19px; font-weight: 600; color: #4A5270">{{y.desc}}</span>
</span>
</button>
</sc-for>
</div>
</sc-if>
<span style="font-size: 14px; line-height: 20px; color: #5B6380">{{letHint}}</span>
<p style="margin: 0; display: flex; align-items: flex-start; gap: 10px; background: #FFF4D1; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 20px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#28314D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span>Los colores de las letras son según disponibilidad y no son personalizables. En Wuf! elegimos la combinación que mejor contraste con los colores de tu collar.</span></p>
</fieldset>



<!-- 1 MEDIDA -->
<fieldset style="margin: 0; border: 2px solid #EFE4D4; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
<legend style="padding: 0 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px"><span style="display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: #A58BE7; align-items: center; justify-content: center; font-size: 17px; margin-right: 8px">3</span>Medida del cuello</legend>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<label for="cm" style="font-weight: 700; font-size: 16px">Su cuello mide</label>
<div style="display: flex; align-items: center; gap: 10px">
<button class="wopt" type="button" aria-label="Menos 1 cm" onClick="{{onMinus}}" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #28314D; background: #FFFFFF; color: #28314D; font-size: 24px; font-weight: 800; line-height: 1; padding: 0">−</button>
<span id="cmLive" aria-live="polite" style="min-width: 86px; text-align: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px; line-height: 32px">{{cmLive}}</span>
<button class="wopt" type="button" aria-label="Más 1 cm" onClick="{{onPlus}}" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #28314D; background: #FFFFFF; color: #28314D; font-size: 24px; font-weight: 800; line-height: 1; padding: 0">+</button>
</div>
</div>
<div style="padding: 6px 4px 0">
<input id="cm" class="wrange" type="range" min="15" max="80" step="1" value="{{sliderVal}}" onInput="{{onSlide}}" onChange="{{onSlideEnd}}" aria-label="Medida del cuello en centímetros" style="background: {{trackBg}}">
<div aria-hidden="true" style="position: relative; height: 22px; margin-top: 8px; font-size: 12px; line-height: 16px; font-weight: 800; color: #5B6380"><span style="position: absolute; left: {{lCH}}; transform: translateX(-50%)">CH</span><span style="position: absolute; left: {{lM}}; transform: translateX(-50%)">M</span><span style="position: absolute; left: {{lG}}; transform: translateX(-50%)">G</span><span style="position: absolute; left: {{lXG}}; transform: translateX(-50%)">XG</span><span style="position: absolute; left: {{lEX}}; transform: translateX(-50%)">+60</span></div>
</div>
</div>
<span style="font-size: 14px; line-height: 20px; font-weight: 800">{{customHint}}</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
<div style="min-height: 84px; border-radius: 16px; border: 2px solid {{s.border}}; background: {{s.bg}}; color: #28314D; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center">
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; line-height: 22px">{{s.id}}</span>
<span style="font-size: 13px; line-height: 16px; font-weight: 700">{{s.range}}</span>
<span style="font-size: 14px; line-height: 18px; font-weight: 800">{{s.price}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase">Cómo medir</p><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><li style="background: #EEE8FB; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; line-height: 22px">1</span><span style="font-size: 14px; line-height: 20px"><b>Usa una cinta de costura,</b> o un cordón que luego mides con una regla.</span></li><li style="background: #FFF4D1; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; line-height: 22px">2</span><span style="font-size: 14px; line-height: 20px"><b>Rodea la base del cuello,</b> justo donde normalmente lleva su collar.</span></li><li style="background: #E0F6F0; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; line-height: 22px">3</span><span style="font-size: 14px; line-height: 20px"><b>Deja dos dedos de holgura.</b> Ese número en centímetros es su medida.</span></li></ol><p style="margin: 0; font-size: 14px; line-height: 20px; color: #5B6380">Que le quede cómodo, ni flojo ni apretado. Si dudas entre dos medidas, elige la mayor. Nosotros elegimos la talla que te corresponde.</p></div>
</fieldset>

<!-- 4 PLACA -->
<fieldset style="margin: 0; border: 2px solid #EFE4D4; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0">
<legend style="padding: 0 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px"><span style="display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: #FF6B85; align-items: center; justify-content: center; font-size: 17px; margin-right: 8px">4</span>Plaquita solidaria</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{placaOpts}}" as="p" hint-placeholder-count="2">
<button class="wopt" type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="min-height: 64px; border-radius: 16px; border: 2px solid {{p.border}}; background: {{p.bg}}; color: #28314D; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left">
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; line-height: 22px">{{p.title}}</span>
<span style="font-size: 13px; line-height: 16px; font-weight: 700">{{p.sub}}</span>
</button>
</sc-for>
</div>
<span style="font-size: 14px; line-height: 20px; color: #5B6380">{{placaHint}}</span>
<sc-if value="{{placa}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; background: #EEE8FB; border-radius: 22px; padding: 14px">
<div role="img" aria-label="{{placaLabel}}" style="position: relative; flex: 0 1 260px; min-width: 180px; aspect-ratio: 510 / 410; border-radius: 16px; overflow: hidden; container-type: inline-size; isolation: isolate; background: #6B3A1E">
<img src="assets/img/placa_base.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
<div class="wlayer wpmA" style="background: {{patA}}"></div>
<div class="wlayer wpmB" style="background: {{patB}}"></div>
<span aria-hidden="true" style="position: absolute; left: 49.8%; top: 57.6%; transform: translate(-50%, -50%) rotate(1.85deg) scaleX(1.2); white-space: nowrap; font-family: Arimo, Arial, Helvetica, sans-serif; font-weight: 700; font-size: {{placaSize}}; line-height: 1; letter-spacing: .1em; padding-left: .1em; background: linear-gradient(180deg, #E6F7FF 0%, #C4EBFE 55%, #A9DCF3 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: #C4EBFE; opacity: .96; filter: drop-shadow(0 -0.5px 0 rgba(0,40,90,.55)) drop-shadow(0 .7px 0 rgba(255,255,255,.35)) blur(.25px)">{{placaText}}</span>
</div>
<div style="flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase">Plaquita solidaria</span>
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px">{{placaText}}</span>
<span style="font-size: 14px; line-height: 20px; color: #4A5270">{{placaCardNote}}</span>
</div>
</div>
</sc-if>
<div style="display: flex; align-items: flex-start; gap: 12px; background: #E0F6F0; border-radius: 16px; padding: 14px 16px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#28314D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"></path></svg>

<script>
// Llave de Google Maps: Netlify la pone aquí al publicar (variable MAPS_API_KEY). Si no existe, se usa el buscador libre.
var GKEY = '__MAPS_API_KEY__';
var HAS_G = /^AIza/.test(GKEY);
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { inv: null, style: null, size: 'M', custom: '', a: 'Lila', b: 'Rosa pastel', target: 'a', keychain: false, petName: '', clientName: '', placa: false, zone: null, copied: '', addr: '', point: null, geoMsg: '', searching: false, sugs: [] };
  }
  componentDidMount() {
    var self = this;
    if (window.loadInventario) window.loadInventario().then(function (inv) { self.setState({ inv: inv }); }, function (e) { console.warn('Inventario: se usa la lista de respaldo.', e); });
  }
  geoOrigin() { return this.props.origen || [28.7117, -106.1397]; }
  kmTo(lat, lon) {
    var o = this.geoOrigin(), R = 6371, r = Math.PI / 180;
    var dLat = (lat - o[0]) * r, dLon = (lon - o[1]) * r;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(o[0] * r) * Math.cos(lat * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  setPoint(lat, lon, msgPrefix) {
    var km = this.kmTo(lat, lon);
    var zone = km <= 3 ? 'z1' : km <= 6 ? 'z2' : km <= 10 ? 'z3' : 'z4';
    var n = zone.slice(1);
    this.setState({ point: [lat, lon, km], zone: zone, copied: '', searching: false,
      geoMsg: (msgPrefix || 'Tu ubicación') + ' está a unos ' + km.toFixed(1) + ' km de UACH Norte: Zona ' + n + '.' });
  }
  onAddr(e) {
    var self = this, v = e.target.value;
    this.setState({ addr: v, sugs: v.trim().length < 4 ? [] : this.state.sugs });
    clearTimeout(this._sugT);
    if (v.trim().length < 4) return;
    this._sugT = setTimeout(function () { self.fetchSugs(v.trim()); }, 450);
  }
  onClear() {
    clearTimeout(this._sugT); this._sugSeq = (this._sugSeq || 0) + 1;
    this.mapClear();
    this.setState({ addr: '', sugs: [], point: null, zone: null, geoMsg: '', searching: false, copied: '' });
    var d = document.getElementById('dir'); if (d) d.focus();
  }
  onKey(e) {
    if (e.key === 'Enter') { e.preventDefault(); var g = this.state.sugs[0]; if (g) this.pickSug(g); else this.onSearch(); }
    else if (e.key === 'Escape') this.setState({ sugs: [] });
  }
  pickSug(g) {
    var self = this; clearTimeout(this._sugT); this._sugSeq = (this._sugSeq || 0) + 1;
    this.setState({ addr: g.label, sugs: [] });
    if (g.placeId) {
      this.setState({ searching: true, geoMsg: 'Buscando…' });
      fetch('https://places.googleapis.com/v1/places/' + g.placeId + '?languageCode=es&sessionToken=' + this._gTok(), { headers: { 'X-Goog-Api-Key': GKEY, 'X-Goog-FieldMask': 'location' } })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) { self._gTokV = null; self.setPoint(d.location.latitude, d.location.longitude, 'Tu dirección'); })
        .catch(function () { self.setState({ searching: false, geoMsg: 'No pudimos ubicar esa dirección. Toca tu ubicación en el mapa o elige tu zona abajo.' }); });
      return;
    }
    this.setPoint(g.lat, g.lon, 'Tu dirección');
  }
  _gTok() { return this._gTokV || (this._gTokV = 'w' + Math.random().toString(36).slice(2) + Date.now().toString(36)); }
  gSugs(q) {
    var o = this.geoOrigin();
    return fetch('https://places.googleapis.com/v1/places:autocomplete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': GKEY },
      body: JSON.stringify({ input: q, languageCode: 'es', regionCode: 'MX', sessionToken: this._gTok(),
        locationBias: { circle: { center: { latitude: o[0], longitude: o[1] }, radius: 25000 } } })
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (j) {
      return (j.suggestions || []).filter(function (x) { return x.placePrediction; }).map(function (x) {
        var pp = x.placePrediction, sf = pp.structuredFormat || {};
        var main = (sf.mainText && sf.mainText.text) || (pp.text && pp.text.text) || '';
        var sub = (sf.secondaryText && sf.secondaryText.text) || '';
        return { main: main, sub: sub, label: (pp.text && pp.text.text) || [main, sub].filter(Boolean).join(', '), placeId: pp.placeId };
      });
    });
  }
  fetchSugs(q) {
    var self = this, seq = this._sugSeq = (this._sugSeq || 0) + 1;
    if (!HAS_G) { this.setState({ sugs: [] }); return; }
    this.gSugs(q).then(function (list) { if (seq !== self._sugSeq) return; self.setState({ sugs: list.slice(0, 5) }); }).catch(function () {});
  }
  onSearch() {
    var self = this, q = String(this.state.addr || '').trim();
    if (q.length < 4) { this.setState({ geoMsg: 'Escribe tu calle, número y colonia.' }); return; }
    clearTimeout(this._sugT); this._sugSeq = (this._sugSeq || 0) + 1;
    var NF = 'No encontramos esa dirección. Toca tu ubicación en el mapa o elige tu zona abajo.';
    if (!HAS_G) { this.setState({ searching: false, geoMsg: 'El buscador no está disponible ahora. Elige tu zona abajo.' }); return; }
    this.setState({ searching: true, geoMsg: 'Buscando…', sugs: [] });
    this.gSugs(q).then(function (list) {
      if (!list.length) { self.setState({ searching: false, geoMsg: NF }); return; }
      self.pickSug(list[0]);
    }).catch(function () { self.setState({ searching: false, geoMsg: 'No pudimos buscar la dirección. Toca tu ubicación en el mapa o elige tu zona abajo.' }); });
  }
  mapClear() {
    if (this._pin) { if (this._pin.setMap) this._pin.setMap(null); else this._pin.remove(); this._pin = null; this._pinKey = null; }
    if (this._map) { this._map.setCenter({ lat: this.geoOrigin()[0], lng: this.geoOrigin()[1] }); this._map.setZoom(12); }
  }
  loadGoogleMap() {
    var self = this;
    if (this._gLoading) return; this._gLoading = true;
    window.gm_authFailure = function () { self._gFail = true; self._map = null; self._mapEl = null; self._pin = null; self.setState({ geoMsg: 'El mapa no está disponible. Elige tu zona abajo.' }); };
    var sc = document.createElement('script');
    sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(GKEY) + '&language=es&region=MX&loading=async&callback=__wufGmap';
    window.__wufGmap = function () { self._gReady = true; self.setState({}); };
    sc.onerror = function () { self._gFail = true; self.setState({}); };
    sc.async = true; document.head.appendChild(sc);
  }
  afterRender() {
    var self = this, slot = document.getElementById('mapSlot');
    if (!slot) return;
    var dbg = /[?&]debug/.test(location.search);
    var why = !HAS_G ? 'No hay llave de Google en esta página (MAPS_API_KEY no se insertó al publicar: revisa la variable y haz Clear cache and deploy site en Netlify).' : this._gFail ? 'Google rechazó la llave o no cargó: revisa que Maps JavaScript API esté activada y que la llave permita este sitio.' : '';
    if (why) { slot.style.display = dbg ? '' : 'none'; if (dbg) slot.innerHTML = '<p style="margin:0;padding:16px;font-weight:700;font-size:14px;color:#28314D">' + why + '</p>'; return; }
    if (!this._gReady) { this.loadGoogleMap(); slot.style.display = 'none'; return; }
    if (!(window.google && window.google.maps)) { slot.style.display = 'none'; return; }
    slot.style.display = '';
    var G = window.google.maps, o = this.geoOrigin(), cols = ['#75D6C0', '#FFCF46', '#A58BE7'];
    if (!this._map) {
      var el = this._mapEl = document.createElement('div');
      el.style.cssText = 'width:100%;height:100%';
      var map = this._map = new G.Map(el, { center: { lat: o[0], lng: o[1] }, zoom: 12, mapTypeControl: false, streetViewControl: false, fullscreenControl: false, gestureHandling: 'cooperative', clickableIcons: false });
      [10, 6, 3].forEach(function (km, i) {
        new G.Circle({ map: map, center: { lat: o[0], lng: o[1] }, radius: km * 1000, strokeColor: cols[2 - i], strokeWeight: 2, fillColor: cols[2 - i], fillOpacity: 0.18, clickable: false });
      });

      onPlus: function () { self.setState({ custom: String(cmOk ? Math.min(MAXCM, cm + 1) : 20), copied: '' }); },
      cmLive: cmOk ? cm + ' cm' : '— cm', sliderVal: cmOk ? cm : MINCM, trackBg: trackBg, lCH: lab.lCH, lM: lab.lM, lG: lab.lG, lXG: lab.lXG, lEX: lab.lEX,
      onKeychain: function (e) { self.setState({ keychain: !!e.target.checked, copied: '' }); },
      onCopy: function () {
        try {
          navigator.clipboard.writeText(summary).then(function () { self.setState({ copied: 'ok' }); }, function () { self.setState({ copied: 'fail' }); });
        } catch (err) { self.setState({ copied: 'fail' }); }
      }
    };
  }
}
