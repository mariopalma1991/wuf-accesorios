<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diseña su Wuf! · Wuf! accesorios</title>
<meta name="description" content="Arma el collar de tu perrito: elige medida, dos colores de paracord, plaquita solidaria y envío. Míralo en vivo y manda tu pedido.">
<meta property="og:title" content="Diseña su Wuf! · Wuf! accesorios">
<meta property="og:description" content="Arma el collar de tu perrito: elige medida, dos colores de paracord, plaquita solidaria y envío. Míralo en vivo y manda tu pedido.">
<meta property="og:image" content="assets/img/nala.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FF6B85">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Arimo:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF9F0}
a{color:#28314D}a:hover{color:#28314D}
button{font-family:inherit;cursor:pointer}
.wbtn{transition:transform .15s ease}
.wbtn:hover{transform:translateY(-2px)}
.wopt{transition:transform .12s ease}
.wopt:hover{transform:translateY(-2px)}
.wbtn:focus-visible,.wopt:focus-visible,.wlink:focus-visible,input:focus-visible{outline:3px solid #28314D;outline-offset:3px}
.wlink{text-decoration:none;background-image:linear-gradient(#FFCF46,#FFCF46);background-size:100% 4px;background-repeat:no-repeat;background-position:0 100%}
.wlink:hover{background-size:100% 100%}
.wlayer{position:absolute;inset:0;mix-blend-mode:multiply;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;transition:background-color .25s ease}
.wmaskA{-webkit-mask-image:url(assets/img/collar_mask_a.png);mask-image:url(assets/img/collar_mask_a.png)}
.wsw{background-image:url(assets/img/sprite.jpg);background-size:600% 700%;background-repeat:no-repeat;background-color:#EFE4D4}
.wpmA{-webkit-mask-image:url(assets/img/placa_mask_a.png);mask-image:url(assets/img/placa_mask_a.png)}
.wpmB{-webkit-mask-image:url(assets/img/placa_mask_b.png);mask-image:url(assets/img/placa_mask_b.png)}
.wmaskB{-webkit-mask-image:url(assets/img/collar_mask_b.png);mask-image:url(assets/img/collar_mask_b.png)}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: Nunito, system-ui, sans-serif; color: #28314D; background: #FFF9F0; min-height: 100vh; overflow-x: hidden">

<!-- NAV -->
<header style="max-width: 1240px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" aria-label="Wuf! inicio" style="display: flex; align-items: center"><img src="assets/img/logo.png" alt="Wuf!" style="height: 56px; width: auto; display: block"></a>
<nav aria-label="Principal" style="display: flex; flex-wrap: wrap; align-items: center; gap: clamp(12px, 3vw, 32px); font-weight: 700; font-size: 16px">
<a class="wlink" href="index.html" style="padding: 2px">Inicio</a>
<a class="wlink" href="#disena" style="padding: 2px">Diseñar</a>
<a class="wlink" href="#medir" style="padding: 2px">Cómo medir</a>
</nav>
</header>

<!-- HERO -->
<section style="max-width: 1240px; margin: 0 auto; padding: clamp(16px, 4vw, 40px) clamp(16px, 4vw, 40px) clamp(32px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 48px">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase">Diseña su Wuf!</p>
<h1 style="margin: 0; font-family: 'Baloo 2', Nunito, sans-serif; font-weight: 800; font-size: clamp(40px, 5.6vw, 68px); line-height: 1; letter-spacing: -.01em">Escoge sus colores y míralo <span style="background: #FFCF46; padding: 0 .12em; border-radius: 14px">en vivo</span>.</h1>
</div>
<p style="margin: 0; flex: 1 1 320px; max-width: 28em; font-size: 19px; line-height: 30px; color: #4A5270">Elige la medida y dos colores de paracord. Al final te damos el pedido listo para mandarlo por Instagram.</p>
</section>

<!-- BUILDER -->
<section id="disena" style="max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px) clamp(64px, 8vw, 104px); display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px">

<!-- PREVIEW COLUMN -->
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="background: #EEE8FB; border-radius: 32px; padding: clamp(16px, 2.4vw, 24px); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 4px 6px 0">
<span style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase">Así se verá</span>
<span style="background: #FFFFFF; border-radius: 999px; padding: 6px 14px; font-size: 14px; line-height: 18px; font-weight: 800">{{sizeLabel}}</span>
</div>
<div role="img" aria-label="{{previewLabel}}" style="position: relative; width: 100%; aspect-ratio: 1185 / 500; border-radius: 22px; overflow: hidden; isolation: isolate; box-shadow: 0 18px 40px -16px rgba(40,49,77,.35); background: #6B3A1E; container-type: inline-size">
<img src="assets/img/collar_base.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
<div class="wlayer wmaskA" style="background-color: {{hexA}}"></div>
<div class="wlayer wmaskB" style="background-color: {{hexB}}"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px 4px">
<span style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 14px; line-height: 18px; font-weight: 700"><span class="wsw" aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(40,49,77,.25); background-position: {{posA}}"></span>Principal: {{colorA}}</span>
<span style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 14px; line-height: 18px; font-weight: 700"><span class="wsw" aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(40,49,77,.25); background-position: {{posB}}"></span>Contraste: {{colorB}}</span>
</div>
<p style="margin: 0; padding: 0 6px 4px; font-size: 14px; line-height: 20px; color: #4A5270">{{previewNote}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; background: #FFFFFF; border-radius: 22px; padding: 14px">
<div role="img" aria-label="{{placaLabel}}" style="position: relative; flex: 0 1 260px; min-width: 180px; aspect-ratio: 510 / 410; border-radius: 16px; overflow: hidden; container-type: inline-size; isolation: isolate; background: #6B3A1E">
<img src="assets/img/placa_base.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
<div class="wlayer wpmA" style="background-color: {{hexA}}"></div>
<div class="wlayer wpmB" style="background-color: {{hexB}}"></div>
<span aria-hidden="true" style="position: absolute; left: 49.8%; top: 57.6%; transform: translate(-50%, -50%) rotate(1.85deg) scaleX(1.2); white-space: nowrap; font-family: Arimo, Arial, Helvetica, sans-serif; font-weight: 700; font-size: {{placaSize}}; line-height: 1; letter-spacing: .1em; padding-left: .1em; background: linear-gradient(180deg, #E6F7FF 0%, #C4EBFE 55%, #A9DCF3 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: #C4EBFE; opacity: .96; filter: drop-shadow(0 -0.5px 0 rgba(0,40,90,.55)) drop-shadow(0 .7px 0 rgba(255,255,255,.35)) blur(.25px)">{{placaText}}</span>
</div>
<div style="flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase">Plaquita solidaria</span>
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px">{{placaText}}</span>
<span style="font-size: 14px; line-height: 20px; color: #4A5270">{{placaCardNote}}</span>
</div>
</div>
</div>

<!-- SUMMARY -->
<div style="background: #FFFFFF; border: 2px solid #EFE4D4; border-radius: 24px; box-shadow: 0 4px 0 rgba(40,49,77,.08); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; line-height: 30px">Tu pedido</h2>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 20px">
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #5B6380">Mascota</dt><dd style="margin: 0; font-weight: 700; font-size: 17px">{{petLabel}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #5B6380">Medida</dt><dd style="margin: 0; font-weight: 700; font-size: 17px">{{sizeLabel}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #5B6380">Colores</dt><dd style="margin: 0; font-weight: 700; font-size: 17px">{{colorA}} + {{colorB}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #5B6380">Placa</dt><dd style="margin: 0; font-weight: 700; font-size: 17px">{{placaSummary}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #5B6380">Envío</dt><dd style="margin: 0; font-weight: 700; font-size: 17px">{{shipSummary}}</dd></div>
</dl>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 2px dashed #EFE4D4; padding-top: 14px; flex-wrap: wrap">
<span style="font-weight: 700; font-size: 17px">Total</span>
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px">{{totalLabel}}</span>
</div>
<span style="font-size: 14px; line-height: 20px; color: #5B6380">{{priceBreakdown}}</span>
</div>
</div>

<!-- OPTIONS COLUMN -->
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<!-- 1 MEDIDA -->
<fieldset style="margin: 0; border: 2px solid #EFE4D4; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
<legend style="padding: 0 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px"><span style="display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: #A58BE7; align-items: center; justify-content: center; font-size: 17px; margin-right: 8px">1</span>Medida del cuello</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="5">
<button class="wopt" type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="min-height: 84px; border-radius: 16px; border: 2px solid {{s.border}}; background: {{s.bg}}; color: #28314D; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; line-height: 22px">{{s.id}}</span>
<span style="font-size: 13px; line-height: 16px; font-weight: 700">{{s.range}}</span>
<span style="font-size: 14px; line-height: 18px; font-weight: 800">{{s.price}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{isCustom}}" hint-placeholder-val="{{ false }}">
<label for="cm" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-weight: 700; font-size: 16px">Su cuello mide
<input id="cm" type="number" min="15" max="80" inputmode="decimal" value="{{custom}}" onInput="{{onCustom}}" placeholder="35" style="width: 96px; min-height: 44px; box-sizing: border-box; border: 2px solid #28314D; border-radius: 12px; padding: 8px 12px; font: inherit; font-weight: 800; font-size: 18px; color: #28314D; background: #FFF9F0">cm</label>
<span style="font-size: 14px; line-height: 20px; font-weight: 700">{{customHint}}</span>
</sc-if>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #5B6380">Mide alrededor del cuello con una cinta y deja espacio para dos dedos. Si dudas entre dos tallas, elige la grande.</p>
</fieldset>

<!-- 2 COLORES -->
<fieldset style="margin: 0; border: 2px solid #EFE4D4; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
<legend style="padding: 0 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px"><span style="display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: #FFCF46; align-items: center; justify-content: center; font-size: 17px; margin-right: 8px">2</span>Colores del tejido</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{targets}}" as="t" hint-placeholder-count="2">
<button class="wopt" type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 64px; border-radius: 16px; border: 2px solid {{t.border}}; background: {{t.bg}}; color: #28314D; padding: 10px 12px; display: flex; align-items: center; gap: 12px; text-align: left">
<span class="wsw" aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(40,49,77,.2); background-position: {{t.pos}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase">{{t.label}}</span>
<span style="font-weight: 800; font-size: 16px; line-height: 20px">{{t.value}}</span>
</span>
</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 700">Ahora eliges: {{targetHint}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px">
<sc-for list="{{colors}}" as="k" hint-placeholder-count="42">
<button class="wopt wsw" type="button" onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" aria-label="{{k.name}}" title="{{k.name}}" style="width: 100%; aspect-ratio: 1 / 1; min-height: 44px; border-radius: 50%; padding: 0; border: 3px solid {{k.ring}}; box-shadow: {{k.shadow}}; background-position: {{k.pos}}"></button>
</sc-for>
</div>
</fieldset>

<!-- 3 MASCOTA -->
<fieldset style="margin: 0; border: 2px solid #EFE4D4; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<legend style="padding: 0 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px"><span style="display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: #75D6C0; align-items: center; justify-content: center; font-size: 17px; margin-right: 8px">3</span>Tu mascota</legend>
<label for="mascota" style="font-weight: 700; font-size: 16px">¿Cómo se llama?</label>
<input id="mascota" type="text" maxlength="30" autocomplete="off" value="{{petName}}" onInput="{{onPetName}}" placeholder="Ej. Nala" style="min-height: 52px; box-sizing: border-box; border: 2px solid #28314D; border-radius: 14px; padding: 10px 16px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 22px; color: #28314D; background: #FFF9F0">
<span style="font-size: 14px; line-height: 20px; color: #5B6380">{{letHint}}</span>
<p style="margin: 0; display: flex; align-items: flex-start; gap: 10px; background: #FFF4D1; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 20px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#28314D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span>Los colores de las letras son según disponibilidad y no son personalizables. En Wuf! elegimos la combinación que mejor contraste con los colores de tu collar.</span></p>
</fieldset>



<!-- 4 PLACA -->
<fieldset style="margin: 0; border: 2px solid #EFE4D4; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0">
<legend style="padding: 0 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px"><span style="display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: #FF6B85; align-items: center; justify-content: center; font-size: 17px; margin-right: 8px">4</span>Plaquita solidaria</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{placaOpts}}" as="p" hint-placeholder-count="2">
<button class="wopt" type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="min-height: 64px; border-radius: 16px; border: 2px solid {{p.border}}; background: {{p.bg}}; color: #28314D; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left">
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; line-height: 22px">{{p.title}}</span>
<span style="font-size: 13px; line-height: 16px; font-weight: 700">{{p.sub}}</span>
</button>
</sc-for>
</div>
<span style="font-size: 14px; line-height: 20px; color: #5B6380">{{placaHint}}</span>
<div style="display: flex; align-items: flex-start; gap: 12px; background: #E0F6F0; border-radius: 16px; padding: 14px 16px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#28314D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"></path></svg>
<p style="margin: 0; font-size: 15px; line-height: 22px"><strong style="font-weight: 800">Plaquita solidaria.</strong> El 100% de lo que pagues por la placa se dona a <strong style="font-weight: 800">Vida Animal CUU</strong>, asociación civil dedicada a promover el bienestar animal.</p>
</div>
</fieldset>

<!-- 5 ENVIO -->
<fieldset style="margin: 0; border: 2px solid #EFE4D4; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
<legend style="padding: 0 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 26px"><span style="display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: #A58BE7; align-items: center; justify-content: center; font-size: 17px; margin-right: 8px">5</span>Envío por zonas</legend>
<p style="margin: 0; font-size: 15px; line-height: 22px">Salimos desde la zona UACH Norte, en Chihuahua capital. Por ahora enviamos dentro de la ciudad y el costo depende de tu zona.</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<div aria-hidden="true" style="position: relative; flex: 0 1 240px; min-width: 200px; aspect-ratio: 1 / 1; margin: 0 auto">
<div style="position: absolute; inset: 0; border-radius: 50%; background: {{ring4}}; border: 2px dashed rgba(40,49,77,.25); transition: background .2s ease"></div>
<div style="position: absolute; inset: 11%; border-radius: 50%; background: {{ring3}}; border: 2px dashed rgba(40,49,77,.25); transition: background .2s ease"></div>
<div style="position: absolute; inset: 22%; border-radius: 50%; background: {{ring2}}; border: 2px dashed rgba(40,49,77,.25); transition: background .2s ease"></div>
<div style="position: absolute; inset: 33%; border-radius: 50%; background: {{ring1}}; border: 2px dashed rgba(40,49,77,.25); transition: background .2s ease"></div>
<span style="position: absolute; left: 50%; top: 5.5%; transform: translate(-50%, -50%); font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 16px; line-height: 1">4</span>
<span style="position: absolute; left: 50%; top: 16.5%; transform: translate(-50%, -50%); font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 16px; line-height: 1">3</span>
<span style="position: absolute; left: 50%; top: 27.5%; transform: translate(-50%, -50%); font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 16px; line-height: 1">2</span>
<span style="position: absolute; left: 50%; top: 38.5%; transform: translate(-50%, -50%); font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 16px; line-height: 1">1</span>
<div style="position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#28314D" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"></path><circle cx="12" cy="10" r="2.5" fill="#FFFFFF" stroke="none"></circle></svg>
<span style="background: #28314D; color: #FFF9F0; border-radius: 999px; padding: 2px 8px; font-size: 11px; line-height: 14px; font-weight: 800; white-space: nowrap">UACH Norte</span>
</div>
<div style="position: absolute; right: 2%; top: 2%; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; border: 2px solid #28314D; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 14px">N</div>
</div>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: 'M', custom: '', a: 'Lila', b: 'Rosa pastel', target: 'a', keychain: false, petName: '', placa: false, zone: null, copied: '' };
  }
  renderVals() {
    var self = this, st = this.state;
    var INK = '#28314D';
    var COLORS = [
      ['Vino','#7A1F35'],['Rojo','#D7262E'],['Azul rey','#1747C9'],['Marino','#1C2747'],['Negro','#1A1A1A'],['Amarillo','#F5B915'],
      ['Rojo intenso','#E8141F'],['Naranja','#F26B1D'],['Azul','#1E7FD8'],['Azul turquesa','#1FA9DE'],['Gris oscuro','#55575C'],['Amarillo neón','#F2E51B'],
      ['Coral','#F5506A'],['Naranja neón','#FF6A13'],['Azul cielo','#8CC4EC'],['Gris','#9A9B9E'],['Verde limón','#8FD614'],['Verde neón','#4BE01F'],
      ['Morado','#7A2DA6'],['Fiusha','#E81C7A'],['Verde petróleo','#0D4D4A'],['Gris claro','#CDD3DB'],['Verde olivo','#5B6234'],['Verde militar','#3F4A2E'],
      ['Rosa','#F27BA6'],['Rosa pastel','#F7B5C9'],['Turquesa','#1BB2B8'],['Lila','#8A62D6'],['Camuflaje amarillo','#4A4420','repeating-linear-gradient(45deg,#1A1A1A 0 5px,#F2D21B 5px 9px)'],['Multicolor','#D8473C','conic-gradient(#E8141F,#F5B915,#4BE01F,#1E7FD8,#8A62D6,#E81C7A,#E8141F)'],
      ['Durazno','#F49A8C'],['Blanco','#F7F7F5'],['Verde','#109A4A'],['Lila jaspeado','#9077D6','repeating-linear-gradient(45deg,#6B4BC4 0 5px,#FFFFFF 5px 8px)'],['Camuflaje verde','#4A5636','repeating-linear-gradient(45deg,#3F4A2E 0 4px,#7A8A5A 4px 8px,#5A3A2A 8px 11px)'],['Neón multicolor','#FF2D95','conic-gradient(#FF2D95,#F2E51B,#4BE01F,#1FA9DE,#FF2D95)'],
      ['Beige','#E6D2B5'],['Caqui','#7D6646'],['Menta','#6FDCC4'],['Dorado/olivo','#A88B3A'],['Café','#6E3B1E'],['Café claro','#B58660']
    ];
    function find(n) { for (var i = 0; i < COLORS.length; i++) if (COLORS[i][0] === n) return COLORS[i]; return COLORS[0]; }
    function pos(n) { var i = 0; for (var j = 0; j < COLORS.length; j++) if (COLORS[j][0] === n) i = j; return ((i % 6) * 20) + '% ' + (Math.floor(i / 6) * 100 / 6).toFixed(4) + '%'; }
    var A = find(st.a), B = find(st.b);

    var SIZES = [['CH','20–28 cm',170],['M','29–38 cm',185],['G','39–48 cm',200],['XG','49–60 cm',215]];
    var PLACA = 180, LETRA = 5;
    var sizes = SIZES.concat([['Otra', 'Tú la escribes', null]]).map(function (s) {
      var on = st.size === s[0];
      return { id: s[0], range: s[1], price: s[2] ? '$' + s[2] : 'Calculado', pressed: on ? 'true' : 'false', border: on ? INK : '#EFE4D4', bg: on ? '#EEE8FB' : '#FFFFFF',
        pick: function () { self.setState({ size: s[0], copied: '' }); } };
    });
    var isCustom = st.size === 'Otra';
    var cur, sizeLabel, customHint = '';
    if (isCustom) {
      var cm = parseFloat(String(st.custom).replace(',', '.'));
      if (cm > 0) {
        var bi = cm <= 28 ? 0 : cm <= 38 ? 1 : cm <= 48 ? 2 : 3;
        var extra = cm > 60 ? Math.ceil((cm - 60) / 10) * 15 : 0;
        var cprice = SIZES[bi][2] + extra;
        cur = ['Otra (' + cm + ' cm)', cm + ' cm', cprice];
        sizeLabel = 'Medida especial · cuello ' + cm + ' cm';
        customHint = cm > 60 ? 'Precio: $' + cprice + ' (talla XG $' + SIZES[3][2] + ' + $15 por cada 10 cm extra).' : 'Precio: $' + cprice + ', igual que la talla ' + SIZES[bi][0] + ' (' + SIZES[bi][1] + ').';
      } else {
        cur = ['Otra', '', 0];
        sizeLabel = 'Medida especial · por definir';
        customHint = 'Escribe la medida para calcular el precio.';
      }
    } else {
      cur = SIZES.filter(function (s) { return s[0] === st.size; })[0] || SIZES[1];
      sizeLabel = 'Talla ' + cur[0] + ' · cuello ' + cur[1];
    }

    var targets = [
      { key: 'a', label: 'Color principal', value: st.a, pos: pos(st.a) },
      { key: 'b', label: 'Color de contraste', value: st.b, pos: pos(st.b) }
    ].map(function (t) {
      var on = st.target === t.key;
      return Object.assign(t, { pressed: on ? 'true' : 'false', border: on ? INK : '#EFE4D4', bg: on ? '#FFF4D1' : '#FFFFFF',
        pick: function () { self.setState({ target: t.key }); } });
    });

    var colors = COLORS.map(function (c) {
      var isA = st.a === c[0], isB = st.b === c[0], on = isA || isB;
      return { name: c[0] + (isA ? ' (principal)' : isB ? ' (contraste)' : ''), pos: pos(c[0]), pressed: on ? 'true' : 'false',
        ring: on ? INK : 'rgba(40,49,77,.15)', shadow: on ? '0 0 0 3px #FFFFFF, 0 0 0 5px ' + INK : 'none',
        pick: function () {
          if (st.target === 'a') self.setState({ a: c[0], target: 'b', copied: '' });
          else self.setState({ b: c[0], copied: '' });
        } };
    });

    var pet = (st.petName || '').trim();
    var nLet = pet.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]/g, '').length;
    var letCost = nLet * LETRA;
    var LCOL = [['#F4F2EE','#FFFFFF','#BDB9B2'],['#1F4FD6','#5C86F2','#12318C'],['#F7801E','#FFB066','#B9520A'],['#E3262E','#FF6A6E','#9E1218'],
      ['#FFCC1F','#FFE67A','#C99400'],['#F2559C','#FF9CCB','#B3256A'],['#4CC23A','#8AE86F','#2A8020'],['#8E55E0','#B994F5','#5A2BA8']];
    var chars = pet.toUpperCase().replace(/[^A-ZÁÉÍÓÚÜÑ0-9]/g, '').slice(0, 12).split('');
    var seed = 7;
    for (var si = 0; si < pet.length; si++) seed = (seed * 31 + pet.charCodeAt(si)) % 100003;
    var scale = Math.min(1, 66 / (Math.max(chars.length, 1) * 16.6));
    var prev = -1;
    var beads = chars.map(function (ch, i) {
      var r = (seed * (i + 3) * 2654435761) % 4294967296;
      var ci = r % LCOL.length; if (ci === prev) ci = (ci + 3) % LCOL.length; prev = ci;
      var c = LCOL[ci];
      return { ch: ch, fs: (27 * scale).toFixed(2) + 'cqw', base: c[0],
        grad: 'linear-gradient(165deg, ' + c[1] + ' 0%, ' + c[0] + ' 42%, ' + c[0] + ' 70%, ' + c[2] + ' 100%)',
        filter: 'drop-shadow(0 ' + (0.35 * scale).toFixed(2) + 'cqw 0 ' + c[2] + ') drop-shadow(0 ' + (0.7 * scale).toFixed(2) + 'cqw ' + (0.8 * scale).toFixed(2) + 'cqw rgba(0,0,0,.4))',
        rot: (((r >>> 5) % 7) - 3) + 'deg', dy: ((((r >>> 9) % 5) - 2) * 0.25 * scale).toFixed(2) + 'cqw' };
    });
    var props = this.props;
    var ZONES = [
      ['z1', 'Zona 1', 'Hasta 3 km de UACH Norte', (props.zona1 ?? 30), '#75D6C0', '#E0F6F0'],
      ['z2', 'Zona 2', 'De 3 a 6 km', (props.zona2 ?? 45), '#FFCF46', '#FFF4D1'],
      ['z3', 'Zona 3', 'De 6 a 10 km', (props.zona3 ?? 60), '#A58BE7', '#EEE8FB'],
      ['z4', 'Zona 4', 'Más de 10 km, resto de la ciudad', (props.zona4 ?? 80), '#FF6B85', '#FFE8EC']
    ];
    var zSel = ZONES.filter(function (z) { return z[0] === st.zone; })[0];
    function zPrice(z) { return (typeof z[3] === 'number' && z[3] > 0) ? z[3] : null; }
    var ship = zSel ? zPrice(zSel) : null;
    var total = cur[2] + letCost + (st.placa ? PLACA : 0) + (ship || 0);
    var zones = ZONES.map(function (z, i) {
      var on = st.zone === z[0], pr = zPrice(z);
      return { n: i + 1, name: z[1], range: z[2], color: z[4], priceLabel: pr ? '$' + pr : '[PRECIO]',
        pressed: on ? 'true' : 'false', border: on ? INK : '#EFE4D4', bg: on ? z[5] : '#FFFFFF',
        pick: function () { self.setState({ zone: z[0], copied: '' }); } };
    });
    var rings = {};
    ZONES.forEach(function (z, i) { rings['ring' + (i + 1)] = (st.zone === z[0]) ? z[4] : z[5]; });
    var shipSummary = zSel ? zSel[1] + (ship ? ' · $' + ship : ' · por confirmar') : 'Elige tu zona';
    var summary = '¡Hola Wuf! Quiero personalizar un collar:\n' +
      '• Mascota: ' + (pet || 'por definir') + '\n' +
      '• Medida: ' + sizeLabel + '\n' +
      '• Colores: ' + st.a + ' (principal) + ' + st.b + ' (contraste)\n' +
      '• Plaquita solidaria: ' + (st.placa ? 'sí, con "' + (pet || 'nombre por definir') + '" (+$' + PLACA + ', 100% para Vida Animal CUU)' : 'no') + '\n' +
      '• Letras: ' + nLet + ' × $' + LETRA + ' = $' + letCost + '\n' +
      '• Envío: ' + shipSummary + '\n' +
      '• Total: $' + total + ' MXN' + (zSel && !ship ? ' + envío' : '');
    var placaText = (pet || 'SU NOMBRE').toUpperCase();
    var CW = { A:.722,B:.722,C:.722,D:.722,E:.667,F:.611,G:.778,H:.722,I:.278,J:.556,K:.722,L:.611,M:.833,N:.722,'Ñ':.722,O:.778,P:.667,Q:.778,R:.722,S:.667,T:.611,U:.722,V:.667,W:.944,X:.667,Y:.667,Z:.611,' ':.278 };
    var em = 0;
    for (var ci = 0; ci < placaText.length; ci++) em += (CW[placaText[ci]] || .62) + .1;
    var placaSize = Math.min(15, 66.7 / (em * 1.2)).toFixed(2) + 'cqw';
    var placaOpts = [[false, 'Sin placa', 'Solo el collar'], [true, 'Con placa', '+$180 · se dona al 100%']].map(function (o) {
      var on = st.placa === o[0];
      return { title: o[1], sub: o[2], pressed: on ? 'true' : 'false', border: on ? INK : '#EFE4D4', bg: on ? '#FFE8EC' : '#FFFFFF',
        pick: function () { self.setState({ placa: o[0], copied: '' }); } };
    });

    return {
      sizes: sizes, isCustom: isCustom, customHint: customHint, custom: st.custom, sizeLabel: sizeLabel,
      targets: targets, targetHint: st.target === 'a' ? 'color principal' : 'color de contraste',
      colors: colors, colorA: st.a, colorB: st.b,
      hexA: A[1], hexB: B[1], posA: pos(st.a), posB: pos(st.b),
      keychain: st.keychain, keychainLabel: st.keychain ? 'Sí, a juego' : 'No',
      previewLabel: 'Foto del collar recoloreada en ' + st.a + ' y ' + st.b + '',
      summary: summary,
      copyLabel: st.copied === 'ok' ? '¡Copiado!' : st.copied === 'fail' ? 'Selecciona el texto y cópialo' : 'Copiar pedido',
      hasName: false, noName: true, beads: beads, beadGap: (0.4 * scale).toFixed(2) + 'cqw',
      previewNote: 'El nombre de la foto es solo de ejemplo. Los colores son aproximados al paracord real.',
      petName: st.petName, petLabel: pet || 'Sin nombre aún',
      letHint: nLet ? 'Su nombre en letras: ' + nLet + (nLet === 1 ? ' letra' : ' letras') + ' × $' + LETRA + ' = $' + letCost + ' MXN.' : 'Su nombre va en letras sobre el collar: $5 MXN por letra.',
      placa: st.placa, placaOpts: placaOpts, placaText: placaText, placaSize: placaSize,
      placaLabel: 'Placa de hueso azul grabada con ' + placaText,
      placaCardNote: st.placa ? 'Incluida en tu pedido. Se dona al 100% a Vida Animal CUU.' : 'Agrégala en el paso 4 por $180. Se dona al 100% a Vida Animal CUU.',
      placaSummary: st.placa ? 'Sí, +$' + PLACA : 'Sin placa',
      totalLabel: '$' + total + ' MXN', zones: zones, shipSummary: shipSummary, ring1: rings.ring1, ring2: rings.ring2, ring3: rings.ring3, ring4: rings.ring4,
      priceBreakdown: (isCustom ? (cur[2] ? 'Collar medida especial $' + cur[2] : 'Collar: escribe su medida') : 'Collar talla ' + cur[0] + ' $' + cur[2]) + (nLet ? ' + ' + nLet + (nLet === 1 ? ' letra' : ' letras') + ' $' + letCost : '') + (st.placa ? ' + plaquita solidaria $' + PLACA : '') + (zSel ? (ship ? ' + envío $' + ship : ' + envío por confirmar') : ' + envío según zona') + '. Precios en pesos mexicanos.',
      placaHint: st.placa ? (pet ? 'Se grabará: ' + placaText + '. Lo puedes ver en la vista previa.' : 'Escribe su nombre en el paso 3 para verlo en la placa.') : 'Placa de hueso con su nombre grabado, $180 MXN adicionales al collar.',
      onPetName: function (e) { self.setState({ petName: e.target.value, copied: '' }); },
      onCustom: function (e) { self.setState({ custom: e.target.value, copied: '' }); },
      onKeychain: function (e) { self.setState({ keychain: !!e.target.checked, copied: '' }); },
      onCopy: function () {
        try {
          navigator.clipboard.writeText(summary).then(function () { self.setState({ copied: 'ok' }); }, function () { self.setState({ copied: 'fail' }); });
        } catch (err) { self.setState({ copied: 'fail' }); }
      }

}
